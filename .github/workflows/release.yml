name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
      - name: Require committed lockfile
        shell: bash
        run: test -f Cargo.lock
      - run: cargo build --workspace --release --all-features --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v5
        with:
          name: cordis-rs-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/cordis*
