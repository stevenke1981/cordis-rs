[workspace]
resolver = "2"
members = [
  "crates/cordis-contracts",
  "crates/cordis-policy",
  "crates/cordis-store",
  "crates/cordis-core",
  "crates/cordis-memory",
  "crates/cordis-runtime",
  "crates/cordis-planner",
  "crates/cordis-socrates",
  "crates/cordis-capability",
  "crates/cordis-mcp",
  "crates/cordis-cli",
  "crates/cordis-sdk",
]

[workspace.package]
version = "0.6.0-alpha.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["CORDIS Rust Contributors"]
repository = "https://github.com/stevenke1981/cordis-rs"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3.20"
pretty_assertions = "1.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
